<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Team Pulse · Invites</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="wide">
  <header class="admin-head">
    <h1 class="admin-title">Invites</h1>
    <p class="sub"><a href="/admin" style="color:#9ca3af">← Back to dashboard</a> · one unique link per person, automatic on the 27th</p>
  </header>
  <div id="demo-banner" class="banner demo hidden">DEMO MODE: fake seeded data, survey window forced open.</div>

    <div class="card" id="email-card">
      <h2>Invites <span class="hint" style="display:inline">(automatic on the 27th)</span></h2>
      <div id="mail-status" class="banner info" style="margin-top:0"></div>
      <div id="gmail-area" class="btnrow" style="margin-top:0"></div>
      <div id="invite-counts" class="countrow"></div>
      <div id="recipient-status"></div>
      <div class="btnrow" style="margin-top:10px;align-items:center;gap:12px">
        <button class="secondary btn-sm" id="team-sync">🔄 Sync team</button>
        <span class="hint" id="team-sync-note" style="align-self:center;margin:0"></span>
      </div>
      <label class="q" for="test-email">Send a test invite to one address</label>
      <div class="btnrow" style="margin-top:0">
        <input type="email" id="test-email" style="max-width:320px" placeholder="you@k-brands.com">
        <button class="secondary" id="email-test">Send test</button>
        <a href="/admin/email-preview" target="_blank" style="align-self:center;font-weight:700">Preview the email ↗</a>
      </div>
      <div id="email-msg" class="banner hidden" style="margin-bottom:0"></div>
    </div>

  <footer>Team Pulse admin</footer>
</main>
<script src="/admin-invites.js"></script>
</body>
</html>

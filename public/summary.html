<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Team Pulse — this month</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      border-top: 3px solid var(--accent);
      padding: 16px; text-align: center; box-shadow: var(--shadow);
    }
    .stat:nth-child(2) { border-top-color: var(--good); }
    .stat:nth-child(3) { border-top-color: var(--amber); }
    .stat:nth-child(4) { border-top-color: var(--navy-2); }
    .stat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 2px; }
    .moves { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .move {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 99px;
      background: var(--surface); padding: 7px 14px;
    }
    .move .d { font-weight: 700; font-variant-numeric: tabular-nums; }
    .move .d.up { color: var(--good); }
    .move .d.down { color: var(--bad); }
    .move .d.flat { color: var(--muted); }
    .promise {
      text-align: center;
      background: var(--navy);
      border-radius: 16px;
      padding: 30px 24px; margin: 18px 0;
    }
    .promise h2 { color: #fff; font-size: 18px; margin: 0 0 8px; }
    .promise p { color: #9ca3af; max-width: 560px; margin: 0 auto; font-size: 14px; }
    .promise .next { color: #93c5fd; font-weight: 600; margin-top: 12px; font-size: 13.5px; }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <h1 class="hero-title">You spoke.<br><span class="grad">We listened.</span></h1>
    <p class="hero-sub" id="hero-sub"></p>
  </header>

  <div id="out"></div>

  <footer>Team Pulse · anonymous, always</footer>
</main>
<script src="/reveal.js"></script>
<script>
(async () => {
  const { summary } = await (await fetch('/api/summary/latest')).json();
  const out = document.getElementById('out');
  const esc = (s) => (s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const monthOf = (cycle) => {
    const [y, m] = cycle.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
  };

  if (!summary) {
    document.getElementById('hero-sub').textContent = 'The next pulse lands soon.';
    out.innerHTML = `<div class="card reveal" style="text-align:center">
      <p style="margin:0">Nothing here yet — results appear right after the monthly pulse closes.</p>
    </div>`;
    observeNew();
    return;
  }

  const month = monthOf(summary.cycle);
  document.getElementById('hero-sub').textContent = `${month} · every single word was read`;

  // 1 — proof of listening, in numbers
  let statsHtml = '';
  if (summary.stats) {
    const s = summary.stats;
    const pct = s.participation.issued ? Math.round((100 * s.participation.used) / s.participation.issued) : null;
    const cards = [
      { n: summary.responses, l: 'anonymous voices' },
      { n: s.comments, l: 'comments read in full' },
      { n: s.upward, l: 'notes to management' },
      ...(pct != null ? [{ n: pct + '%', l: 'of the team took part' }] : []),
    ];
    statsHtml = `
      <span class="section-eyebrow reveal">Your voice, in numbers</span>
      <div class="stat-strip">
        ${cards.map((c, i) => `<div class="stat reveal" style="--d:${i * 0.07}s"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join('')}
      </div>`;
  }

  // 2 — the big three
  const themes = [summary.theme1, summary.theme2, summary.theme3].filter(Boolean);
  const big3 = themes.length ? `
    <span class="section-eyebrow reveal">The 3 things you told us the loudest</span>
    ${themes.map((t, i) => `
      <div class="b3card reveal" style="--d:${i * 0.09}s">
        <div class="b3num">${i + 1}</div>
        <p>${esc(t)}</p>
      </div>`).join('')}` : '';

  // 3 — honest movement since last month (up AND down — trust needs both)
  let movesHtml = '';
  if (summary.moves && summary.moves.length) {
    const chip = (m) => {
      const dir = m.delta > 0.05 ? 'up' : m.delta < -0.05 ? 'down' : 'flat';
      const sign = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
      const val = dir === 'flat' ? '' : ' ' + Math.abs(m.delta).toFixed(1);
      return `<span class="move">${esc(m.label)} <span class="d ${dir}">${sign}${val}</span></span>`;
    };
    movesHtml = `
      <span class="section-eyebrow reveal">Since you last spoke — the honest scoreboard</span>
      <div class="moves reveal">${summary.moves.map(chip).join('')}</div>`;
  }

  // 4 — awards
  let awards = '';
  if (summary.fun) {
    const f = summary.fun;
    const cards = [];
    if (f.topBlocker) cards.push({ emoji: '🏆', label: 'Blocker of the month', value: `${esc(f.topBlocker.label)} · ${f.topBlocker.count} votes` });
    if (f.mostImproved) cards.push({ emoji: '📈', label: 'Most improved', value: `${esc(f.mostImproved.label)} · +${f.mostImproved.delta.toFixed(1)}` });
    if (f.strongest) cards.push({ emoji: '💪', label: 'Strongest area', value: `${esc(f.strongest.label)} · ${f.strongest.avg.toFixed(1)}/10` });
    if (cards.length) {
      awards = `
        <span class="section-eyebrow reveal">And the awards go to…</span>
        <div class="fun-grid">${cards.map((c, i) =>
          `<div class="fun reveal" style="--d:${i * 0.09}s"><div class="emoji">${c.emoji}</div><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`).join('')}
        </div>`;
    }
  }

  // 5 — what happens because of this + the standing promise
  const nextDate = summary.nextOpens
    ? new Date(summary.nextOpens).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })
    : null;
  const promise = `
    <div class="promise reveal">
      <h2>What happens with all this</h2>
      <p>${esc(summary.action) || 'Khalid and Amna read every response — the comments, the concerns, the ideas — and what you wrote here sets what management works on next.'}
      Private concerns went only to management and are being handled quietly, exactly as promised.</p>
      ${nextDate ? `<div class="next">Next pulse: ${nextDate} — your link will land in your inbox.</div>` : ''}
    </div>`;

  out.innerHTML = statsHtml + big3 + movesHtml + awards + promise;
  observeNew();

  function observeNew() {
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const els = document.querySelectorAll('#out .reveal');
    if (reduced) { els.forEach((el) => el.classList.add('in-view')); return; }
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach((el) => io.observe(el));
  }
})();
</script>
</body>
</html>
